name: Temporary macOS installation check

on:
  push:
    branches: [fix/issue-14-macos-font-discovery]

permissions:
  contents: read

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      BLENDER_VERSION: 5.2.2
      BLENDER_USER_SCRIPTS: ${{ github.workspace }}/.ci/blender-profile/scripts
      BLENDER_USER_CONFIG: ${{ github.workspace }}/.ci/blender-profile/config
      BLENDER_USER_EXTENSIONS: ${{ github.workspace }}/.ci/blender-profile/extensions
      MPLCONFIGDIR: ${{ github.workspace }}/.ci/matplotlib
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install official Blender and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          curl --fail --location --retry 3 "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-macos-arm64.dmg" -o "$RUNNER_TEMP/blender.dmg"
          mkdir -p "$RUNNER_TEMP/blender-mount"
          hdiutil attach "$RUNNER_TEMP/blender.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/blender-mount"
          ditto "$RUNNER_TEMP/blender-mount/Blender.app" "$RUNNER_TEMP/Blender.app"
          hdiutil detach "$RUNNER_TEMP/blender-mount"
          blender="$RUNNER_TEMP/Blender.app/Contents/MacOS/Blender"
          python="$RUNNER_TEMP/Blender.app/Contents/Resources/5.2/python/bin/python3.13"
          "$blender" --version
          "$python" -m ensurepip
          "$python" -m pip install pyvista cmcrameri pytest
          "$python" -m pip freeze
          printf 'BLENDER=%s\nBLENDER_PYTHON=%s\n' "$blender" "$python" >> "$GITHUB_ENV"
          mkdir -p "$BLENDER_USER_SCRIPTS" "$BLENDER_USER_CONFIG" "$BLENDER_USER_EXTENSIONS" "$MPLCONFIGDIR"
      - name: Native ZIP installation and activation
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/check_zip.py" <<'PY'
          import os
          from pathlib import Path
          import sys
          import zipfile
          import bpy
          root = Path(os.environ["GITHUB_WORKSPACE"])
          archive = Path(os.environ["RUNNER_TEMP"]) / "vtk-addon.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as bundle:
              files = list(root.glob("*.py")) + list((root / "view3d_panel").glob("*.py")) + [root / "LICENSE"]
              for path in files:
                  bundle.write(path, "blender_vtk_importer_exporter/" + path.relative_to(root).as_posix())
          assert bpy.ops.preferences.addon_install(filepath=str(archive)) == {"FINISHED"}
          assert bpy.ops.preferences.addon_enable(module="blender_vtk_importer_exporter") == {"FINISHED"}
          assert bpy.context.scene.default_colormap == "viridis"
          assert "matplotlib.pyplot" not in sys.modules
          assert bpy.ops.preferences.addon_disable(module="blender_vtk_importer_exporter") == {"FINISHED"}
          print("PASS: native macOS ZIP installation and activation")
          PY
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python "$RUNNER_TEMP/check_zip.py"
      - name: Activation with broken font discovery
        run: '"$BLENDER" --background --factory-startup --python-exit-code 1 --python tests/check_installation.py'
      - name: All Crameri maps match the original package
        run: '"$BLENDER_PYTHON" tests/check_colormaps.py'
      - name: Existing mesh and attribute suite
        working-directory: tests
        run: 'PYTHONPATH="$PWD" "$BLENDER" --python-use-system-env --background --factory-startup --python-exit-code 1 --python run_pytest_in_blender.py'
